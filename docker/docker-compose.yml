services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--migrate-only"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Storage__Provider: Postgres
      Cache__Provider: Redis
      Cache__DecisionTtlSeconds: 15
      Cache__Redis__Configuration: redis:6379
      ConnectionStrings__Aegis: Host=postgres;Port=5432;Database=aegis;Username=postgres;Password=postgres

  api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Storage__Provider: Postgres
      Cache__Provider: Redis
      Cache__DecisionTtlSeconds: 15
      Cache__Redis__Configuration: redis:6379
      ConnectionStrings__Aegis: Host=postgres;Port=5432;Database=aegis;Username=postgres;Password=postgres
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:3000
    ports:
      - "5271:8080"

volumes:
  postgres-data:
  redis-data:
