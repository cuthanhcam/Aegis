services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD before running the stack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--migrate-only"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Storage__Provider: Postgres
      Cache__Provider: Redis
      Cache__DecisionTtlSeconds: 15
      Cache__Redis__Configuration: redis:6379
      ConnectionStrings__Aegis: Host=postgres;Port=5432;Database=aegis;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD before running the stack}
      Auth__DemoUsers__0__Username: admin
      Auth__DemoUsers__0__Password: ${AEGIS_DEMO_ADMIN_PASSWORD:?set AEGIS_DEMO_ADMIN_PASSWORD before running the stack}
      Auth__DemoUsers__0__Subject: user:admin
      Auth__DemoUsers__0__TenantId: default
      Auth__DemoUsers__0__Roles__0: authorization_admin
      Auth__DemoUsers__1__Username: dev
      Auth__DemoUsers__1__Password: ${AEGIS_DEMO_DEV_PASSWORD:?set AEGIS_DEMO_DEV_PASSWORD before running the stack}
      Auth__DemoUsers__1__Subject: user:dev
      Auth__DemoUsers__1__TenantId: tenant-dev

  api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Storage__Provider: Postgres
      Cache__Provider: Redis
      Cache__DecisionTtlSeconds: 15
      Cache__Redis__Configuration: redis:6379
      ConnectionStrings__Aegis: Host=postgres;Port=5432;Database=aegis;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD before running the stack}
      Auth__DemoUsers__0__Username: admin
      Auth__DemoUsers__0__Password: ${AEGIS_DEMO_ADMIN_PASSWORD:?set AEGIS_DEMO_ADMIN_PASSWORD before running the stack}
      Auth__DemoUsers__0__Subject: user:admin
      Auth__DemoUsers__0__TenantId: default
      Auth__DemoUsers__0__Roles__0: authorization_admin
      Auth__DemoUsers__1__Username: dev
      Auth__DemoUsers__1__Password: ${AEGIS_DEMO_DEV_PASSWORD:?set AEGIS_DEMO_DEV_PASSWORD before running the stack}
      Auth__DemoUsers__1__Subject: user:dev
      Auth__DemoUsers__1__TenantId: tenant-dev
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:3000
    ports:
      - "5271:8080"

volumes:
  postgres-data:
  redis-data:
