name: .NET CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true

      - name: Restore
        run: dotnet restore Aegis.sln

      - name: Build
        run: dotnet build Aegis.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Aegis.sln --configuration Release --no-build --verbosity normal
